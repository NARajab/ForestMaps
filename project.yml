name: ForestMaps
options:
  bundleIdPrefix: id.belantarasubur
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.5.0
    DEVELOPMENT_TEAM: ""
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19

targets:
  ForestMaps:
    type: application
    platform: iOS
    dependencies:
      - package: ZIPFoundation
    sources:
      - path: ForestMaps
        excludes:
          - Resources/SampleData/*.pdf
    resources:
      - path: ForestMaps/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.belantarasubur.ForestMaps
        INFOPLIST_KEY_CFBundleDisplayName: Forest Maps
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Forest Maps menggunakan lokasi iPhone untuk menampilkan posisi GPS Anda di atas peta offline.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_STYLE: Automatic
    info:
      path: ForestMaps/Info.plist
      properties:
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Map
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
          - CFBundleTypeName: KML/KMZ Map Data
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.google.earth.kml
              - com.google.earth.kmz
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UIApplicationSupportsIndirectInputEvents: true
